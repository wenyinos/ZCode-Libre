name: Release

# 手动触发用于试跑与补发；推送 v* tag 时自动构建并发布。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v3.14.4）。留空则只构建产物、不创建 Release。"
        required: false
      reuse_run_id:
        description: "复用指定运行的产物发布（填运行 ID）：跳过构建，直接把该运行的 artifacts 发到 Release，全程在服务端完成。"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # 复用已有产物时要读取该运行的 artifacts。
  actions: read

concurrency:
  # 手动触发时取消同分支上仍在跑的旧运行：试跑阶段反复触发很常见，
  # 不取消就会让新运行一直排队等旧运行结束。
  # tag 推送时保持不取消，避免打断正在进行的正式发布。
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # macOS 与 Windows 在托管 runner 上直接构建。
  # macOS 只出 arm64：Apple 已停止支持 Intel 机型。
  # Windows 只出 x64：预编译原生工具（bfs/ripgrep/ugrep）没有 Windows 产物。
  build:
    name: Build ${{ matrix.name }}
    # 复用已有产物时跳过构建。
    if: inputs.reuse_run_id == ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            args: --os mac --arch arm64
          - name: Windows-x64
            os: windows-latest
            args: --os win --arch x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备构建资源
        run: pnpm bootstrap

      # 产物未签名：macOS 首次打开被 Gatekeeper 拦截、Windows 提示 SmartScreen，
      # 下载页写明了绕过方式。签名需要各平台证书，不在此 workflow 范围内。
      # 必须显式指定生产后端：未设置 ZCODE_ENV 时会被当作 test，
      # 产物会带上 _TEST 后缀（连测试后端）与 Preview 身份，不能作为正式版本发布。
      - name: 打包
        env:
          ZCODE_ENV: production
        run: pnpm bundle:desktop -- ${{ matrix.args }}

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe

  # Linux 按包格式拆分 job，在 Debian 12 容器内构建。
  #
  # 为什么 rpm 也放在 Debian 而不是 Fedora：electron-builder 固定调用 fpm（跨发行版打包器），
  # 而它的 fpm 二进制在精简的 fedora 镜像里无法执行（exit 127），在 debian:12 里正常。
  # fpm 生成的是标准 rpm 包，安装时由目标系统的 rpm/dnf 处理，与构建发行版无关；
  # 容器内同时装 rpmbuild 作为 fpm 的后端。
  build-linux:
    name: Build ${{ matrix.name }}
    # 复用已有产物时跳过构建。
    if: inputs.reuse_run_id == ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux-deb-x64, os: ubuntu-latest, container: "debian:12", pkg: deb, arch: x64 }
          - { name: Linux-deb-arm64, os: ubuntu-24.04-arm, container: "debian:12", pkg: deb, arch: arm64 }
          - { name: Linux-rpm-x64, os: ubuntu-latest, container: "debian:12", pkg: rpm, arch: x64 }
          - { name: Linux-rpm-arm64, os: ubuntu-24.04-arm, container: "debian:12", pkg: rpm, arch: arm64 }
    steps:
      # 容器里没有 Node，也未必有所需格式的打包后端，先按发行版补齐。
      - name: 安装基础工具与打包后端
        run: |
          # 各发行版补齐两类依赖：
          #   1) 打包后端：dpkg-dev / rpm-build / libarchive
          #   2) 原生模块工具链：node-pty 等需要 node-gyp 现场编译，
          #      ubuntu runner 预装了 build-essential，精简容器里没有。
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl git xz-utils build-essential python3 \
              dpkg-dev rpm
          fi

      - uses: actions/checkout@v4

      # 容器内运行用户与检出文件的属主可能不一致，git 2.35+ 的 dubious ownership 检查
      # 会直接拒绝操作（bootstrap 第一步就是 git submodule update）。
      # 这里放开白名单，并打印版本与状态，失败时能直接定位到是不是 git 的问题。
      - name: 容器内信任工作目录
        run: |
          git config --global --add safe.directory '*'
          echo "git: $(git --version)"
          git status --short | head -3
          git submodule status 2>&1 | head -3 || true

      # 直接取 Node 官方二进制而非走各发行版仓库：三个发行版的 Node 版本差异很大，
      # 统一版本才能与 mise.toml / .nvmrc 保持一致。
      - name: 安装 Node 24 与 pnpm
        run: |
          case "$(uname -m)" in
            x86_64) NODE_ARCH=x64 ;;
            aarch64|arm64) NODE_ARCH=arm64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-${NODE_ARCH}.tar.xz" \
            | tar -xJ -C /usr/local --strip-components=1
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          node --version && pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备构建资源
        run: pnpm bootstrap

      # ZCODE_LINUX_TARGET 让每个 job 只产出自己那一种格式。
      - name: 打包
        env:
          ZCODE_ENV: production
          ZCODE_LINUX_TARGET: ${{ matrix.pkg }}
        run: pnpm bundle:desktop -- --os linux --arch ${{ matrix.arch }}

      # 官方 zcode 包与本分支包内置同一批 Electron 二进制，ELF 内容相同所以 build-id 相同。
      # rpm 默认（宏 _build_id_links compat）会为主包生成 /usr/lib/.build-id/xx/yyy 符号链接，
      # 两个包争用同一批路径会让 rpm -i 直接报 file conflicts 装不上。
      # electron-builder.config.js 已传 _build_id_links none 关掉生成；这里断言它真的生效——
      # 该宏只在 rpmbuild 侧生效，配置写错不会有别的报错，只会在用户安装时炸。
      - name: 校验 rpm 不含 build-id 链接
        if: matrix.pkg == 'rpm'
        run: |
          found=$(rpm -qpl packages/desktop/dist/*.rpm | grep '/usr/lib/.build-id' || true)
          if [ -n "$found" ]; then
            echo "::error::rpm 仍包含 build-id 链接，与官方 zcode 包会冲突："
            echo "$found"
            exit 1
          fi
          echo "已确认 rpm 不含 /usr/lib/.build-id 条目，可与官方包共存"

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm

  publish:
    name: Publish release
    needs: [build, build-linux]
    # 只有打了 v* tag、或手动填了 tag 时才发布；否则 Runs 里只留构建产物。
    # always() 让复用模式（构建被跳过）下仍会运行。
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是生成的 changelog 要用的：默认的浅克隆只有最后一次提交，
      # 既列不出本次改动，也判不了哪些提交来自上游。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 上游 git 历史只用于判断「这条提交是不是从上游来的」，因此：
      #  - 必须 --no-tags：上游与本仓库共用 v3.14.x 这类 tag 名但指向不同提交，
      #    带上 tags 会让本地 tag 撞名，进而把 changelog 的基准算错；
      #  - 拿不到上游不算失败：此时脚本会退化成单栏并写明原因，而不是猜。
      - name: 取上游历史用于改动分类
        continue-on-error: true
        run: |
          git remote add upstream https://github.com/zai-org/ZCode.git 2>/dev/null || true
          git fetch --no-tags upstream main

      - name: 生成发布说明
        run: |
          node scripts/generate-release-notes.mjs \
            --to HEAD \
            --template .github/release-body-template.md \
            --out release-body.md

      # 复用模式：直接取指定运行的 artifacts，不重新构建，也不经过本地。
      - name: 下载已有产物
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.reuse_run_id }}" \
            --repo "${{ github.repository }}" \
            --dir artifacts
          # gh run download 会按 artifact 名建子目录，而 release 上传与 sha256sum 需要
          # 同层文件；这里把子目录里的产物展平上来，再删掉空目录。
          find artifacts -mindepth 2 -type f -exec mv -t artifacts {} +
          find artifacts -mindepth 1 -type d -empty -delete
          ls -la artifacts | head -20

      - uses: actions/download-artifact@v4
        if: inputs.reuse_run_id == ''
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * | grep -v 'checksums.txt' > checksums.txt
          cat checksums.txt

      # 说明正文由 scripts/generate-release-notes.mjs 生成：它按「提交是否在上游 main 的
      # 可达范围内」把改动分成「本仓库新增」与「上游合并」两栏，模板在
      # .github/release-body-template.md。generate_release_notes 仍开着，用于追加
      # GitHub 自己的 Full Changelog 提交列表。
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          body_path: release-body.md
