name: Release

# 手动触发用于试跑与补发；推送 v* tag 时自动构建并发布。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v3.14.4）。留空则只构建产物、不创建 Release。"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # macOS 与 Windows 在托管 runner 上直接构建。
  # macOS 只出 arm64：Apple 已停止支持 Intel 机型。
  # Windows 只出 x64：预编译原生工具（bfs/ripgrep/ugrep）没有 Windows 产物。
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            args: --os mac --arch arm64
          - name: Windows-x64
            os: windows-latest
            args: --os win --arch x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备构建资源
        run: pnpm bootstrap

      # 产物未签名：macOS 首次打开被 Gatekeeper 拦截、Windows 提示 SmartScreen，
      # 下载页写明了绕过方式。签名需要各平台证书，不在此 workflow 范围内。
      - name: 打包
        run: pnpm bundle:desktop -- ${{ matrix.args }}

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe

  # Linux 按包格式拆分：deb 在 Debian、rpm 在 Fedora、pacman 在 Arch 容器内构建，
  # 各自使用发行版原生的打包后端（dpkg-deb / rpmbuild / bsdtar），
  # 而不是在单一发行版上补装异构后端——工具版本与元数据默认值都会更贴合目标发行版。
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux-deb-x64, os: ubuntu-latest, container: "debian:12", pkg: deb, arch: x64 }
          - { name: Linux-deb-arm64, os: ubuntu-24.04-arm, container: "debian:12", pkg: deb, arch: arm64 }
          - { name: Linux-rpm-x64, os: ubuntu-latest, container: "fedora:latest", pkg: rpm, arch: x64 }
          - { name: Linux-rpm-arm64, os: ubuntu-24.04-arm, container: "fedora:latest", pkg: rpm, arch: arm64 }
          - { name: Linux-pacman-x64, os: ubuntu-latest, container: "archlinux:base-devel", pkg: pacman, arch: x64 }
          - { name: Linux-pacman-arm64, os: ubuntu-24.04-arm, container: "archlinux:base-devel", pkg: pacman, arch: arm64 }
    steps:
      # 容器里没有 Node，也未必有所需格式的打包后端，先按发行版补齐。
      - name: 安装基础工具与打包后端
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git xz-utils dpkg-dev
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y curl git xz tar which rpm-build
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm curl git xz tar libarchive
          fi

      - uses: actions/checkout@v4

      # 直接取 Node 官方二进制而非走各发行版仓库：三个发行版的 Node 版本差异很大，
      # 统一版本才能与 mise.toml / .nvmrc 保持一致。
      - name: 安装 Node 24 与 pnpm
        run: |
          case "$(uname -m)" in
            x86_64) NODE_ARCH=x64 ;;
            aarch64|arm64) NODE_ARCH=arm64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-${NODE_ARCH}.tar.xz" \
            | tar -xJ -C /usr/local --strip-components=1
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          node --version && pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备构建资源
        run: pnpm bootstrap

      # ZCODE_LINUX_TARGET 让每个 job 只产出自己那一种格式。
      - name: 打包
        env:
          ZCODE_LINUX_TARGET: ${{ matrix.pkg }}
        run: pnpm bundle:desktop -- --os linux --arch ${{ matrix.arch }}

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst

  publish:
    name: Publish release
    needs: [build, build-linux]
    # 只有打了 v* tag、或手动填了 tag 时才发布；否则 Runs 里只留构建产物。
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * | grep -v 'checksums.txt' > checksums.txt
          cat checksums.txt

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## 下载 / Downloads

            未签名构建，首次打开会被系统安全提示拦截；用下方 `checksums.txt` 核对 SHA256。
            Unsigned builds — the first launch is blocked by Gatekeeper / SmartScreen. Verify against `checksums.txt`.

            **macOS**（Apple Silicon / arm64）

            下载 `.dmg`，把 ZCode-Libre 拖入「应用程序」。首次打开若被拦截：
            `sudo xattr -rd com.apple.quarantine /Applications/ZCode-Libre.app`

            **Windows**（x64）

            下载 `.exe`，SmartScreen 提示时选「更多信息」→「仍要运行」。

            **Linux**（x64 与 arm64 均可用）

            按发行版选择系统包：包在对应发行版容器内构建，使用该发行版原生的打包后端。

            | 发行版 / Distro | 包格式 |
            |---|---|
            | Debian / Ubuntu | `.deb`（`sudo apt install ./<file>.deb`） |
            | Fedora / RHEL / openSUSE | `.rpm`（`sudo dnf install ./<file>.rpm`） |
            | Arch Linux | `.pkg.tar.zst`（`sudo pacman -U <file>`） |

            架构按文件名后缀区分：`x86_64`/`amd64` 为 64 位 x86，`aarch64`/`arm64` 为 ARM64。

            安装后从应用菜单或 `zcode-libre` 启动。本分支与官方 ZCode 共用 `.zcode` 数据根，
            但使用独立的界面偏好目录，因此两者可以同时安装、同时运行。

            ## 关于这个版本 / About this build

            - 遥测与厂商服务默认关闭，模型用你自己的 API Key 接入。
            - 应用内更新只检测本仓库的 Release 并引导下载，不会自动安装，也不会被换回官方版本。
            - 与上游的完整差异见 [UPSTREAM.md](https://github.com/wenyinos/ZCode-Libre/blob/main/UPSTREAM.md)。
