name: Release CLI

# 命令行版（TUI + Web）的构建流程，独立成文件方便维护；由 release.yml 以可复用
# workflow（workflow_call）调用，与桌面产物在同一个运行里构建、同一次发布、同一个
# 版本号——推一次 tag 就完成全部发布。
#
# 只负责构建与上传 artifacts，不创建 Release：发布说明与资产上传统一由
# release.yml 的 publish 完成，避免两边都写说明而互相覆盖。
# workflow_dispatch 供单独构建/排查使用（同样只产 artifacts，不发布）。
#
# 产物覆盖 macOS arm64 与 Linux x64/arm64 三个平台。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CLI (TUI + Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 在 Linux runner 上就能打出 macOS/Linux 通用包：pnpm 的 supportedArchitectures
      # 会安装所有平台的可选依赖，node-pty prebuild 随包携带；包内原生件只覆盖这三个
      # 平台，见 scripts/zcode-distribution/assets.mjs 的 cliReleaseTargets。
      #
      # 必须显式指定生产后端：未设置 ZCODE_ENV 时内置 provider 配置会取测试环境。
      # --base-url/--tarball-url 指向本仓库 Release 的固定地址：latest.json 与
      # install.sh 从 releases/latest/download 取；tarball 是扁平资产，用完整地址
      # （GitHub 的资产 URL 不支持 <base>/releases/<version>/ 这种路径布局）。
      - name: 打包
        env:
          ZCODE_ENV: production
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          pnpm build:zcode \
            --base-url "https://github.com/${{ github.repository }}/releases/latest/download" \
            --tarball-url "https://github.com/${{ github.repository }}/releases/latest/download/zcode-${VERSION}.tar.gz"

      # 产物交给 release.yml 的 publish 统一发布；这里同时留档，便于失败时从 Run 取回。
      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: CLI-zcode
          if-no-files-found: error
          path: |
            dist/zcode/releases/*/*.tar.gz
            dist/zcode/releases/*/sha256.txt
            dist/zcode/latest.json
            dist/zcode/install.sh
