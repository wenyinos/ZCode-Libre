name: Release CLI

# 命令行版（TUI + Web）的独立发布流程，与桌面版 Release 分开维护：
# 产物覆盖 macOS arm64 与 Linux x64/arm64 三个平台，版本号与根 package.json 对齐，
# 与桌面产物并存于同一 tag 的 Release。
#
# 与 release.yml 的关系：两者都用 .github/release-body-template.md 生成发布说明
# （模板里已含命令行版安装说明），内容一致，谁后完成谁的版本生效；
# 建议先跑本流程、再跑桌面流程，让 GitHub 自动追加的 Full Changelog 由最后一步生成。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v3.14.7）。留空则只构建产物、不创建 Release。"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # 手动触发时取消同分支上仍在跑的旧运行；tag 推送时不取消，避免打断正式发布。
  group: release-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build-and-publish:
    name: Build CLI (TUI + Web)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是发布说明要用的：默认浅克隆列不出本次改动，也判不了哪些提交来自上游。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 上游历史只用于发布说明的来源分栏；拿不到不算失败。
      - name: 取上游历史用于改动分类
        continue-on-error: true
        run: |
          git remote add upstream https://github.com/zai-org/ZCode.git 2>/dev/null || true
          git fetch --no-tags upstream main

      - name: 生成发布说明
        run: |
          node scripts/generate-release-notes.mjs \
            --to HEAD \
            --template .github/release-body-template.md \
            --out release-body.md

      # 在 Linux runner 上就能打出 macOS/Linux 通用包：pnpm 的 supportedArchitectures
      # 会安装所有平台的可选依赖，node-pty prebuild 随包携带；包内原生件只覆盖这三个
      # 平台，见 scripts/zcode-distribution/assets.mjs 的 cliReleaseTargets。
      #
      # 必须显式指定生产后端：未设置 ZCODE_ENV 时内置 provider 配置会取测试环境。
      # --base-url/--tarball-url 指向本仓库 Release 的固定地址：latest.json 与
      # install.sh 从 releases/latest/download 取；tarball 是扁平资产，用完整地址
      # （GitHub 的资产 URL 不支持 <base>/releases/<version>/ 这种路径布局）。
      - name: 打包
        env:
          ZCODE_ENV: production
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          pnpm build:zcode \
            --base-url "https://github.com/${{ github.repository }}/releases/latest/download" \
            --tarball-url "https://github.com/${{ github.repository }}/releases/latest/download/zcode-${VERSION}.tar.gz"

      # 产物留档：发布失败时可直接从 Run 里取回，不必重跑构建。
      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: CLI-zcode
          if-no-files-found: error
          path: |
            dist/zcode/releases/*/*.tar.gz
            dist/zcode/releases/*/sha256.txt
            dist/zcode/latest.json
            dist/zcode/install.sh

      # tag 留空时只构建不发；有 tag 时把 CLI 资产发到该 tag 的 Release。
      - name: 发布
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/zcode/releases/*/*.tar.gz
            dist/zcode/releases/*/sha256.txt
            dist/zcode/latest.json
            dist/zcode/install.sh
          body_path: release-body.md
